<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda libre</title>
    <link href="src/output.css" rel="stylesheet">
</head>
<body>
    <main class="bg-[#14213D] text-[#FAF6EF]">
        <section class="w-full px-6 py-20">
            <div class="mx-auto max-w-3xl space-y-6">
                <p class="inline-block rounded-full bg-[#F39A2B] px-4 py-1 text-sm font-bold uppercase tracking-widest text-[#14213D]">Nuevo - Jueves a sábado</p>

                <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-white">Rueda Nocturna</h1>

                <p class="max-w-xl text-lg leading-relaxed">Descubre Medellín en bici cuando se encienden las luces</p>

                <ul class="flex gap-10">
                    <li>
                        <p class="text-4xl font-extrabold text-[#F39A2B]">3</p>
                        <p class="text-sm uppercase tracking-widest">rutas</p>
                    </li>
                    <li>
                        <p class="text-sm uppercase tracking-widest">Desde</p>
                        <p class="text-4xl font-extrabold text-[#F39A2B]">$55.000</p>
                    </li>
                </ul>

                <a href="../paginas/reservas.html" class="inline-block rounded-lg bg-[#F39A2B] px-8 py-3 text-base font-bold text-[#14213D] shadow-md hover:bg-white hover:shadow-lg focus:outline-hidden focus:ring-4 focus:ring-white">Inscríbete</a>
            </div>
        </section>

        <section class="w-full px-6 pb-20">
            <div class="mx-auto max-w-3xl space-y-6">
                <h2 class="text-2xl font-bold text-white">Componente: botón</h2>
                <div class="flex flex-wrap gap-4">
                    <button type="button" class="rounded-lg bg-[#F39A2B] px-8 py-3 text-base font-bold text-[#14213D] shadow-md hover:bg-white hover:shadow-lg focus:outline-hidden focus:ring-4 focus:ring-white">Inscríbete</button>

                    <button type="button" class="rounded-lg bg-[#FAF6EF] px-8 py-3 text-base font-bold text-[#14213D] shadow-md hover:bg-[#F39A2B] hover:shadow-lg focus:outline-hidden focus:ring-4 focus:ring-white">Ver rutas</button>

                    <button type="button" class="rounded-lg border-2 border-[#FAF6EF] px-8 py-3 text-base font-bold text-[#FAF6EF] hover:bg-[#FAF6EF] hover:text-[#14213D] focus:outline-hidden focus:ring-4 focus:ring-[#F39A2B]">Más información</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
